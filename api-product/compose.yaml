services:
  db:
    image: postgres:16-alpine
    container_name: product-api-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_api}
      POSTGRES_USER: ${POSTGRES_USER:-product_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-product_api_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - product_api_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  product_api_postgres_data:
